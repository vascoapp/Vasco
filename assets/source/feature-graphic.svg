<?xml version="1.0" encoding="UTF-8"?>
<!--
  Play Store feature graphic. 1024×500 wide banner, shown at the top of
  the Play listing page above screenshots. No transparency allowed.
  No text overlay required (Play does that automatically with the app
  title), but the visual identity should match the in-app DK theme.

  R66r68/r69 placeholder. Replace with brand-team final art.
-->
<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F141B"/>
      <stop offset="0.5" stop-color="#0B0E11"/>
      <stop offset="1" stop-color="#1A0F07"/>
    </linearGradient>
    <linearGradient id="vfill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="0.6" stop-color="#C2410C"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Glow halo behind the V -->
  <circle cx="280" cy="250" r="230" fill="url(#glow)"/>

  <!-- V mark on the left third -->
  <g transform="translate(180, 100)">
    <path d="
      M 0 0
      L 70 0
      L 140 200
      L 210 0
      L 280 0
      L 175 290
      L 105 290
      Z"
      fill="url(#vfill)"/>
    <circle cx="140" cy="320" r="9" fill="#F59E0B" opacity="0.85"/>
  </g>

  <!-- Wordmark on the right two-thirds -->
  <text x="540" y="240"
        font-family="Archivo, Inter, system-ui, sans-serif"
        font-size="96"
        font-weight="900"
        letter-spacing="6"
        fill="#FFFFFF">VASCO</text>

  <text x="540" y="300"
        font-family="Inter, system-ui, sans-serif"
        font-size="28"
        font-weight="500"
        letter-spacing="2"
        fill="#9CA3AF">AI ADMIN FOR TRADES</text>
</svg>
