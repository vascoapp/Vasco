appId: com.vascobuild.app
name: Capture App Store screenshots (5 hero × 1 locale)
tags:
  - screenshots
# NO `env:` defaults for LOCALE/VARIANT.
#
# A declared default WINS over `-e` in this maestro version: with `LOCALE: en`
# here, `-e LOCALE=de` was ignored and a German run wrote files named
# `6_9inch_en_*`. Across six locales every file would collide on the same name
# and the sweep would silently yield 5 screenshots instead of 90 — while every
# step reported COMPLETED. (`DEMO_ACCOUNT` worked only because it is NOT
# declared here.) capture-screenshots.sh always passes all three.
---

# R66r67: app-store screenshots for one locale × one device variant.
# Run via scripts/capture-screenshots.sh which loops 6 locales × N variants.
#
# Naming: ${VARIANT}_${LOCALE}_${n}_${slug}.png
# Output: maestro saves screenshots relative to the CWD (repo root).
# scripts/capture-screenshots.sh moves them into ./screenshots/ named for ASC.
#
# Each screenshot maps to App Store Connect's required slots:
#   1_vandaag          — search-result hero (EVE queue + today)
#   2_quote_builder    — tiered quote preview
#   3_geld_outstanding — invoice list + payment-link CTA
#   4_photo_to_quote   — AI photo analysis
#   5_compliance       — VAT prep / GoBD audit trail

# 1. Launch into the requested locale.
# Vasco persists user.language via Profile setting; we set it via the
# onboarding language step on first launch, or via the language picker if
# already onboarded. clearState: true forces a fresh hydrate so the device
# locale picker fires (Vasco defaults to device locale on first run).
- launchApp:
    clearState: true

# A Release bundle with clearState re-hydrates from scratch, and first paint on
# a cold simulator has been measured at up to ~2 MINUTES on this machine.
# maestro's default element wait is ~15s, so every run failed with
# "Element not found: login-toggle-signin" against a screen that renders it
# perfectly — the flow was racing the splash, not missing a testID.
- extendedWaitUntil:
    visible:
      id: "login-toggle-signin"
    timeout: 180000

# 2. Welcome-first login → one-tap demo login.
# The login screen defaults to the welcome view (Create Account CTA); the demo
# cards live in the sign-in view and render ONLY in DEMO_MODE builds. DEMO_MODE
# is build-time (EXPO_PUBLIC_DEMO_MODE=true when bundling) — a launchApp arg does
# NOT work because EXPO_PUBLIC_* is inlined at build. Both anchors are
# locale-independent testIDs (added in app/login.tsx). handleDemoLogin logs in
# with no password, so no text entry is needed.
- tapOn:
    id: "login-toggle-signin"
# Same race one level down: the sign-in view fades in and the DEMO cards mount
# after it. Verified the id IS in the hierarchy
# (`demo-account-contractor@vasco.dev`) — the flow was simply tapping before it
# existed.
# Per-LOCALE demo account, injected by capture-screenshots.sh.
#
# The account carries language AND country (handwerker@vasco.de.dev is
# de/DE), so this is what makes a German screenshot show German COPY and
# German currency/VAT formatting. Device locale alone only reaches the login
# screen — after login the account profile wins, which is why every shot came
# out Dutch when only AppleLanguages was set.
- extendedWaitUntil:
    visible:
      id: "demo-account-contractor@vasco.dev"
    timeout: 60000
# The EU market accounts (handwerker/plombier/fontanero/idraulico) sit BELOW
# the fold — the visible cards are the NL/role ones. tapOn does not scroll.
- scrollUntilVisible:
    element:
      id: "demo-account-${DEMO_ACCOUNT}"
    direction: DOWN
    timeout: 150000
- tapOn:
    id: "demo-account-${DEMO_ACCOUNT}"
- waitForAnimationToEnd:
    timeout: 3000

# 3. Language is set on the DEVICE, not in the app.
#
# The in-app path (tab-ai -> open-profile -> profile-language-row -> pick) was
# five fragile steps and the last one is IMPOSSIBLE for maestro: DKMenu is a
# React Native <Modal>, and maestro's iOS driver does not traverse into it. A
# hierarchy dump with the menu open and "English" plainly on screen contains the
# anchor row ("Taal") and NOTHING from the menu — so no matcher works, by id or
# by text.
#
# capture-screenshots.sh now sets AppleLanguages/AppleLocale on the simulator
# before each locale's run. With clearState there is no saved profile, so
# `applySavedLanguage` falls through to the device locale. Verified on the
# simulator: the whole UI renders German ("Konto erstellen", "FÜR DAS HANDWERK
# GEBAUT") with no in-app interaction at all.

# 4. Screenshot 1 — Vandaag
- extendedWaitUntil:
    visible:
      id: "tab-index"
    timeout: 150000
- tapOn:
    id: "tab-index"
    optional: true
- assertVisible:
    id: "vasco-card"
    optional: true
- takeScreenshot: "${VARIANT}_${LOCALE}_1_vandaag"

# 5. Screenshot 2 — Tiered Quote Builder (opened via the werk FAB testID).
# The old flow tapped text "Nieuwe offerte", which only exists as an EMPTY-STATE
# CTA — in a seed-data build werk has content so it never renders. new-quote-fab
# is the persistent FAB → /contractor/tiered-quote.
- extendedWaitUntil:
    visible:
      id: "tab-werk"
    timeout: 150000
- tapOn:
    id: "tab-werk"
- tapOn:
    id: "new-quote-fab"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: "${VARIANT}_${LOCALE}_2_quote_builder"

# 6. Screenshot 4 — Photo → Quote (AI). Reached via the AI-scan row INSIDE the
# quote builder (photo-to-quote is a sub-view, not a standalone screen). The old
# flow tapped text "AIQuoteFromPhoto" (a raw component name, never on screen)
# from the wrong tab. NOTE: photo-to-quote is paid-tier gated — if the demo
# account is free-tier an upgrade Alert shows instead of the photo-to-quote
# empty state (testID photo-to-quote). Validate empirically on the first run.
- tapOn:
    id: "ai-scan-row"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "${VARIANT}_${LOCALE}_4_photo_to_quote"
# `pressKey: Back` is an ANDROID concept. iOS has no hardware back button, so
# these two did nothing and the flow sat on the AI-quote photo MODAL forever —
# every later `tab-*` then failed because the tab bar was covered. Close the
# modal by its own control instead.
- tapOn:
    id: "ai-quote-close"
- waitForAnimationToEnd:
    timeout: 2000
# ...and the quote BUILDER underneath it, which the second Back was for.
- tapOn:
    id: "quote-builder-close"
- waitForAnimationToEnd:
    timeout: 2000

# 7. Screenshot 3 — Geld (outstanding invoices)
- extendedWaitUntil:
    visible:
      id: "tab-geld"
    timeout: 150000
- tapOn:
    id: "tab-geld"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "${VARIANT}_${LOCALE}_3_geld_outstanding"

# 8. Screenshot 5 — Compliance / VAT prep. The BTW-aangifte card (testID
# vat-prep-card) renders when the business country is NL or DE (independent of
# UI locale, so it shows in every language run for the NL demo contractor) and
# routes to /contractor/vat-prep. Old flow tapped localized text that never
# matched the real label ("Prepare VAT return").
# Line 523 of a 1155-line screen — below the fold, and tapOn does not scroll.
- scrollUntilVisible:
    element:
      id: "vat-prep-card"
    direction: DOWN
    timeout: 150000
- tapOn:
    id: "vat-prep-card"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "${VARIANT}_${LOCALE}_5_compliance"
