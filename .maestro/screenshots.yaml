appId: com.vascobuild.app
name: Capture App Store screenshots (5 hero × 1 locale)
tags:
  - screenshots
env:
  # Override at invocation: maestro test -e LOCALE=nl -e VARIANT=6_9inch ...
  LOCALE: en
  VARIANT: 6_9inch
---

# R66r67: app-store screenshots for one locale × one device variant.
# Run via scripts/capture-screenshots.sh which loops 6 locales × N variants.
#
# Naming: ${VARIANT}_${LOCALE}_${n}_${slug}.png
# Output: maestro saves to ~/.maestro/tests/<runId>/screenshots/
# scripts/capture-screenshots.sh moves them into ./screenshots/ named for ASC.
#
# Each screenshot maps to App Store Connect's required slots:
#   1_vandaag          — search-result hero (EVE queue + today)
#   2_quote_builder    — tiered quote preview
#   3_geld_outstanding — invoice list + payment-link CTA
#   4_photo_to_quote   — AI photo analysis
#   5_compliance       — VAT prep / GoBD audit trail

# 1. Launch into the requested locale.
# Vasco persists user.language via Profile setting; we set it via the
# onboarding language step on first launch, or via the language picker if
# already onboarded. clearState: true forces a fresh hydrate so the device
# locale picker fires (Vasco defaults to device locale on first run).
- launchApp:
    clearState: true

# 2. Welcome-first login → one-tap demo login.
# The login screen defaults to the welcome view (Create Account CTA); the demo
# cards live in the sign-in view and render ONLY in DEMO_MODE builds. DEMO_MODE
# is build-time (EXPO_PUBLIC_DEMO_MODE=true when bundling) — a launchApp arg does
# NOT work because EXPO_PUBLIC_* is inlined at build. Both anchors are
# locale-independent testIDs (added in app/login.tsx). handleDemoLogin logs in
# with no password, so no text entry is needed.
- tapOn:
    id: "login-toggle-signin"
- tapOn:
    id: "demo-account-contractor@vasco.dev"
- waitForAnimationToEnd:
    timeout: 3000

# 3. Switch language to ${LOCALE} via Vasco hub (tab-ai) → Profile gear
# (open-profile) → Language row (profile-language-row) → pick locale.
# All testID-anchored so the path is locale-independent. The language picker is
# a native Alert whose buttons read "🇳🇱 Nederlands", so ${LOCALE_DISPLAY}
# (e.g. "Nederlands") matches as a substring. For LOCALE=en (device default)
# this re-selects English — a harmless no-op. Profile is a pushed stack screen
# (no tab bar), so one Back returns to the hub before the screenshot sweep.
- tapOn:
    id: "tab-ai"
- tapOn:
    id: "open-profile"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "profile-language-row"
- tapOn:
    text: "${LOCALE_DISPLAY}"
- pressKey: Back

# 4. Screenshot 1 — Vandaag
- tapOn:
    id: "tab-index"
    optional: true
- assertVisible:
    id: "vasco-card"
    optional: true
- takeScreenshot: "${VARIANT}_${LOCALE}_1_vandaag"

# 5. Screenshot 2 — Tiered Quote Builder (opened via the werk FAB testID).
# The old flow tapped text "Nieuwe offerte", which only exists as an EMPTY-STATE
# CTA — in a seed-data build werk has content so it never renders. new-quote-fab
# is the persistent FAB → /contractor/tiered-quote.
- tapOn:
    id: "tab-werk"
- tapOn:
    id: "new-quote-fab"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: "${VARIANT}_${LOCALE}_2_quote_builder"

# 6. Screenshot 4 — Photo → Quote (AI). Reached via the AI-scan row INSIDE the
# quote builder (photo-to-quote is a sub-view, not a standalone screen). The old
# flow tapped text "AIQuoteFromPhoto" (a raw component name, never on screen)
# from the wrong tab. NOTE: photo-to-quote is paid-tier gated — if the demo
# account is free-tier an upgrade Alert shows instead of the photo-to-quote
# empty state (testID photo-to-quote). Validate empirically on the first run.
- tapOn:
    id: "ai-scan-row"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "${VARIANT}_${LOCALE}_4_photo_to_quote"
- pressKey: Back
- pressKey: Back

# 7. Screenshot 3 — Geld (outstanding invoices)
- tapOn:
    id: "tab-geld"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "${VARIANT}_${LOCALE}_3_geld_outstanding"

# 8. Screenshot 5 — Compliance / VAT prep. The BTW-aangifte card (testID
# vat-prep-card) renders when the business country is NL or DE (independent of
# UI locale, so it shows in every language run for the NL demo contractor) and
# routes to /contractor/vat-prep. Old flow tapped localized text that never
# matched the real label ("Prepare VAT return").
- tapOn:
    id: "vat-prep-card"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "${VARIANT}_${LOCALE}_5_compliance"
