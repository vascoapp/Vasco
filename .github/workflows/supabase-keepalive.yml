name: Supabase keep-alive

# =============================================================================
# WHY THIS EXISTS
# =============================================================================
# Prod Supabase (VascoBuild) is on the FREE tier, which pauses a project after
# ~7 days of inactivity. A paused prod DB is a full app outage — login, reads,
# writes and edge functions all fail — and it has already happened once
# (2026-07-15), where it was misdiagnosed for days as an auth/email bug.
#
# Pro ($25/mo) is the real fix and is still the recommendation. Until then this
# keeps the idle timer from ever reaching 7 days, for $0.
#
# It deliberately runs OUTSIDE Supabase. The project already has pg_cron jobs
# (supabase/cron.sql), but those execute *inside* the database, and internal
# cron ticks are not a reliable substitute for genuine inbound project traffic.
# A plain external request is what the idle timer is actually watching.
#
# Why GitHub Actions and not a Vercel cron (vercel.json crons + an API route),
# which is the house default elsewhere: this is a LIVENESS check, so it should
# not share a failure domain with the thing it protects. A Vercel cron needs a
# new route, a vercel.json and a production redeploy of `admin` just to send one
# request — and it stops firing if that deploy is broken, exactly when you most
# want to know the database is still up. This runs from a third place, needs no
# deploy, and its red/green is visible in the repo's Actions tab.
#
# The request calls get_portal_by_access_code — a SECURITY DEFINER RPC that is
# already granted to anon — with a code that cannot exist. That guarantees a
# real query reaches Postgres (not just an edge/CDN touch), returns null, reads
# nothing and writes nothing.
#
# SUPABASE_URL / SUPABASE_ANON_KEY are repo secrets. The anon key is not
# sensitive (it ships inside the mobile bundle and the web client by design);
# it lives in secrets to keep the two environments swappable, not to hide it.
# =============================================================================

on:
  schedule:
    # 06:17 UTC daily. Off the hour on purpose: GitHub delays cron runs when
    # the shared queue spikes, which is worst at :00.
    - cron: '17 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping prod Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping PostgREST (RPC round-trip to Postgres)
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY repo secrets are not set — the keep-alive is a no-op until they are."
            exit 1
          fi

          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -X POST "$URL/rest/v1/rpc/get_portal_by_access_code" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            -d '{"p_access_code":"keepalive-not-a-real-code"}')

          echo "HTTP $code"
          head -c 200 /tmp/body || true
          echo

          # 200 with a null body is the expected answer for an unknown code.
          # Anything else means the project is unreachable, the anon grant on
          # the RPC was dropped, or the project is ALREADY paused — all worth
          # a red run rather than a silent pass.
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not answer 200 (got $code). The project may be paused or the RPC grant changed."
            exit 1
          fi

      - name: Report
        run: echo "Prod Supabase answered — idle timer reset."
